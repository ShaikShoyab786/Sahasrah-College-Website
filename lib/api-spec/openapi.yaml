      required: [callbackPopupEnabled, callbackPopupDelaySeconds, callbackPopupEyebrow, callbackPopupHeading, callbackPopupDescription, callbackPopupNameLabel, callbackPopupPhoneLabel, callbackPopupCourseLabel, callbackPopupEmailLabel, callbackPopupMessageLabel, callbackPopupSubmitButtonLabel, callbackPopupSuccessMessage, courseOptions]

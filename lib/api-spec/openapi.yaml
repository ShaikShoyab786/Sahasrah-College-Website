openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: public
    description: Public website content
  - name: admin
    description: Protected admin content management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: loginAdmin
      tags: [auth]
      summary: Sign in to the admin dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutAdmin
      tags: [auth]
      summary: Sign out of the admin dashboard
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getAdminSession
      tags: [auth]
      summary: Get the current admin session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [public]
      summary: Read public college identity settings
      responses:
        "200":
          description: Public site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /homepage-hero:
    get:
      operationId: getHomepageHero
      tags: [public]
      summary: Read the published homepage hero
      responses:
        "200":
          description: Homepage hero content
          content:

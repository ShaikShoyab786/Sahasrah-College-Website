            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/contact-enquiries/{id}:
    get:
      operationId: getAdminContactEnquiry
      tags: [admin]
      summary: Read a Contact enquiry and its private notes
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact enquiry with append-only admin notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiryDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAdminContactEnquiry
      tags: [admin]
      summary: Update Contact enquiry follow-up state
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryUpdate"
      responses:
        "200":
          description: Updated Contact enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiry"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminContactEnquiry
      tags: [admin]
      summary: Delete a Contact enquiry
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Enquiry deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/contact-enquiries/{id}/notes:

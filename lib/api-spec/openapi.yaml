      required:
        - message
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
        displayName:
          type: string
      required:
        - authenticated

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: public
    description: Public website content
  - name: admin
    description: Protected admin content management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: loginAdmin
      tags: [auth]
      summary: Sign in to the admin dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutAdmin
      tags: [auth]
      summary: Sign out of the admin dashboard
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getAdminSession
      tags: [auth]
      summary: Get the current admin session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [public]
      summary: Read public college identity settings
      responses:
        "200":
          description: Public site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /homepage-hero:
    get:
      operationId: getHomepageHero
      tags: [public]
      summary: Read the published homepage hero
      responses:
        "200":
          description: Homepage hero content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageHeroSlides"
  /homepage-about-preview:
    get:
      operationId: getHomepageAboutPreview
      tags: [public]
      summary: Read the visible homepage About Preview
      responses:
        "200":
          description: Homepage About Preview content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageAboutPreview"
        "404":
          description: About Preview is hidden or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /about-hero:
    get:
      operationId: getAboutHero
      tags: [public]
      summary: Read the visible About page hero
      responses:
        "200":
          description: About hero content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutHero"
        "404":
          description: About hero is hidden or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /about-story:
    get:
      operationId: getAboutStory
      tags: [public]
      summary: Read the visible About page story
      responses:
        "200":
          description: About story and timeline content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutStory"
        "404":
          description: About story is hidden or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /about-chairman-message:
    get:
      operationId: getAboutChairmanMessage
      tags: [public]
      summary: Read the visible About page chairman message
      responses:
        "200":
          description: Chairman message content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutChairmanMessage"
        "404":
          description: Chairman message is hidden or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/site-settings:
    put:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update public college identity settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Updated site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/homepage-hero:
    put:
      operationId: updateHomepageHero
      tags: [admin]
      summary: Update the homepage hero
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageHeroSlidesInput"
      responses:
        "200":
          description: Updated homepage hero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageHeroSlides"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/homepage-about-preview:
    get:
      operationId: getAdminHomepageAboutPreview
      tags: [admin]
      summary: Read homepage About Preview settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Homepage About Preview settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageAboutPreview"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateHomepageAboutPreview
      tags: [admin]
      summary: Update homepage About Preview settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageAboutPreviewInput"
      responses:
        "200":
          description: Updated homepage About Preview settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageAboutPreview"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/about-hero:
    get:
      operationId: getAdminAboutHero
      tags: [admin]
      summary: Read About page hero settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: About hero settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutHero"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAboutHero
      tags: [admin]
      summary: Update About page hero settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutHeroInput"
      responses:
        "200":
          description: Updated About hero settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutHero"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/about-story:
    get:
      operationId: getAdminAboutStory
      tags: [admin]
      summary: Read About page story settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: About story and timeline settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutStory"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAboutStory
      tags: [admin]
      summary: Update About page story and timeline settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutStoryInput"
      responses:
        "200":
          description: Updated About story and timeline settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutStory"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/about-chairman-message:
    get:
      operationId: getAdminAboutChairmanMessage
      tags: [admin]
      summary: Read About page chairman message settings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Chairman message settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutChairmanMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAboutChairmanMessage
      tags: [admin]
      summary: Update About page chairman message settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutChairmanMessageInput"
      responses:
        "200":
          description: Updated chairman message settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutChairmanMessage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/uploads:
    post:
      operationId: uploadAdminImage
      tags: [admin]
      summary: Upload a logo or hero image
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: Uploaded image reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sahasara_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
        displayName:
          type: string
      required:
        - authenticated
        - email
        - displayName
    SiteSettings:
      type: object
      properties:
        id:
          type: string
        collegeName:
          type: string
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        primaryColor:
          type: string
        accentColor:
          type: string
        footerText:
          type: string
      required:
        - id
        - collegeName
        - tagline
        - logoUrl
        - email
        - phone
        - address
        - primaryColor
        - accentColor
        - footerText
    SiteSettingsInput:
      type: object
      properties:
        collegeName:
          type: string
          minLength: 1
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        footerText:
          type: string
      required:
        - collegeName
        - tagline
        - logoUrl
        - email
        - phone
        - address
        - primaryColor
        - accentColor
        - footerText
    HomepageHeroSlide:
      type: object
      properties:
        id:
          type: string
        displayOrder:
          type: integer
          minimum: 1
          maximum: 3
        eyebrowText:
          type: string
        heading:
          type: string
        highlightedHeadingText:
          type: string
        description:
          type: string
        primaryButtonLabel:
          type: string
        primaryButtonUrl:
          type: string
        secondaryButtonLabel:
          type: string
        secondaryButtonUrl:
          type: string
        heroImageUrl:
          type: ["string", "null"]
        heroImageAltText:
          type: string
      required:
        - id
        - displayOrder
        - eyebrowText
        - heading
        - highlightedHeadingText
        - description
        - primaryButtonLabel
        - primaryButtonUrl
        - secondaryButtonLabel
        - secondaryButtonUrl
        - heroImageUrl
        - heroImageAltText
    HomepageHeroSlides:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "#/components/schemas/HomepageHeroSlide"
    HomepageHeroSlideInput:
      type: object
      properties:
        displayOrder:
          type: integer
          minimum: 1
          maximum: 3
        eyebrowText:
          type: string
        heading:
          type: string
          minLength: 1
        highlightedHeadingText:
          type: string
        description:
          type: string
        primaryButtonLabel:
          type: string
        primaryButtonUrl:
          type: string
        secondaryButtonLabel:
          type: string
        secondaryButtonUrl:
          type: string
        heroImageUrl:
          type: ["string", "null"]
        heroImageAltText:
          type: string
          minLength: 1
      required:
        - displayOrder
        - eyebrowText
        - heading
        - highlightedHeadingText
        - description
        - primaryButtonLabel
        - primaryButtonUrl
        - secondaryButtonLabel
        - secondaryButtonUrl
        - heroImageUrl
        - heroImageAltText
    HomepageHeroSlidesInput:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "#/components/schemas/HomepageHeroSlideInput"
    HomepageAboutPreview:
      type: object
      properties:
        id:
          type: string
        eyebrow:
          type: string
        heading:
          type: string
        description:
          type: string
        body:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        primaryImage:
          type: ["string", "null"]
        primaryImageAltText:
          type: string
        secondaryImage:
          type: ["string", "null"]
        secondaryImageAltText:
          type: string
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - eyebrow
        - heading
        - description
        - body
        - buttonLabel
        - buttonHref
        - primaryImage
        - primaryImageAltText
        - secondaryImage
        - secondaryImageAltText
        - isVisible
        - sortOrder
        - updatedAt
    HomepageAboutPreviewInput:
      type: object
      properties:
        eyebrow:
          type: string
        heading:
          type: string
          minLength: 1
        description:
          type: string
        body:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        primaryImage:
          type: ["string", "null"]
        primaryImageAltText:
          type: string
        secondaryImage:
          type: ["string", "null"]
        secondaryImageAltText:
          type: string
        isVisible:
          type: boolean
        sortOrder:
          type: integer
      required:
        - eyebrow
        - heading
        - description
        - body
        - buttonLabel
        - buttonHref
        - primaryImage
        - primaryImageAltText
        - secondaryImage
        - secondaryImageAltText
        - isVisible
        - sortOrder
    AboutHeroStat:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        label:
          type: string
        icon:
          type: ["string", "null"]
        displayOrder:
          type: integer
        isVisible:
          type: boolean
      required:
        - id
        - value
        - label
        - icon
        - displayOrder
        - isVisible
    AboutHeroStatInput:
      type: object
      properties:
        value:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        icon:
          type: ["string", "null"]
        displayOrder:
          type: integer
          minimum: 1
          maximum: 4
        isVisible:
          type: boolean
      required:
        - value
        - label
        - icon
        - displayOrder
        - isVisible
    AboutHero:
      type: object
      properties:
        id:
          type: string
        eyebrow:
          type: string
        heading:
          type: string
        description:
          type: string
        mainImageUrl:
          type: ["string", "null"]
        mainImageAltText:
          type: string
        floatingLabel:
          type: string
        floatingAcademicYear:
          type: string
        floatingAvailabilityText:
          type: string
        floatingSupportingText:
          type: string
        floatingImageUrl:
          type: ["string", "null"]
        floatingImageAltText:
          type: string
        primaryButtonLabel:
          type: string
        primaryButtonUrl:
          type: string
        primaryButtonVisible:
          type: boolean
        secondaryButtonLabel:
          type: string
        secondaryButtonUrl:
          type: string
        secondaryButtonVisible:
          type: boolean
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        updatedAt:
          type: string
          format: date-time
        stats:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/AboutHeroStat"
      required:
        - id
        - eyebrow
        - heading
        - description
        - mainImageUrl
        - mainImageAltText
        - floatingLabel
        - floatingAcademicYear
        - floatingAvailabilityText
        - floatingSupportingText
        - floatingImageUrl
        - floatingImageAltText
        - primaryButtonLabel
        - primaryButtonUrl
        - primaryButtonVisible
        - secondaryButtonLabel
        - secondaryButtonUrl
        - secondaryButtonVisible
        - isVisible
        - sortOrder
        - updatedAt
        - stats
    AboutHeroInput:
      type: object
      properties:
        eyebrow:
          type: string
          minLength: 1
        heading:
          type: string
          minLength: 1
        description:
          type: string
        mainImageUrl:
          type: ["string", "null"]
        mainImageAltText:
          type: string
        floatingLabel:
          type: string
        floatingAcademicYear:
          type: string
        floatingAvailabilityText:
          type: string
        floatingSupportingText:
          type: string
        floatingImageUrl:
          type: ["string", "null"]
        floatingImageAltText:
          type: string
        primaryButtonLabel:
          type: string
        primaryButtonUrl:
          type: string
        primaryButtonVisible:
          type: boolean
        secondaryButtonLabel:
          type: string
        secondaryButtonUrl:
          type: string
        secondaryButtonVisible:
          type: boolean
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        stats:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/AboutHeroStatInput"
      required:
        - eyebrow
        - heading
        - description
        - mainImageUrl
        - mainImageAltText
        - floatingLabel
        - floatingAcademicYear
        - floatingAvailabilityText
        - floatingSupportingText
        - floatingImageUrl
        - floatingImageAltText
        - primaryButtonLabel
        - primaryButtonUrl
        - primaryButtonVisible
        - secondaryButtonLabel
        - secondaryButtonUrl
        - secondaryButtonVisible
        - isVisible
        - sortOrder
        - stats
    AboutTimelineItem:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
        title:
          type: string
        description:
          type: string
        displayOrder:
          type: integer
        isVisible:
          type: boolean
      required:
        - id
        - period
        - title
        - description
        - displayOrder
        - isVisible
    AboutTimelineItemInput:
      type: object
      properties:
        period:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        displayOrder:
          type: integer
          minimum: 1
          maximum: 12
        isVisible:
          type: boolean
      required:
        - period
        - title
        - description
        - displayOrder
        - isVisible
    AboutStory:
      type: object
      properties:
        id:
          type: string
        eyebrow:
          type: string
        heading:
          type: string
        description:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        mainImage:
          type: ["string", "null"]
        mainImageAltText:
          type: string
        secondaryImage:
          type: ["string", "null"]
        secondaryImageAltText:
          type: string
        thirdImage:
          type: ["string", "null"]
        thirdImageAltText:
          type: string
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        updatedAt:
          type: string
          format: date-time
        timelineItems:
          type: array
          items:
            $ref: "#/components/schemas/AboutTimelineItem"
      required:
        - id
        - eyebrow
        - heading
        - description
        - buttonLabel
        - buttonHref
        - mainImage
        - mainImageAltText
        - secondaryImage
        - secondaryImageAltText
        - thirdImage
        - thirdImageAltText
        - isVisible
        - sortOrder
        - updatedAt
        - timelineItems
    AboutStoryInput:
      type: object
      properties:
        eyebrow:
          type: string
          minLength: 1
        heading:
          type: string
          minLength: 1
        description:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        mainImage:
          type: ["string", "null"]
        mainImageAltText:
          type: string
        secondaryImage:
          type: ["string", "null"]
        secondaryImageAltText:
          type: string
        thirdImage:
          type: ["string", "null"]
        thirdImageAltText:
          type: string
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        timelineItems:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/AboutTimelineItemInput"
      required:
        - eyebrow
        - heading
        - description
        - buttonLabel
        - buttonHref
        - mainImage
        - mainImageAltText
        - secondaryImage
        - secondaryImageAltText
        - thirdImage
        - thirdImageAltText
        - isVisible
        - sortOrder
        - timelineItems
    AboutChairmanMessage:
      type: object
      properties:
        id:
          type: string
        eyebrow:
          type: string
        heading:
          type: string
        message:
          type: string
        signatureName:
          type: string
        role:
          type: string
        portraitImage:
          type: ["string", "null"]
        portraitAltText:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        buttonVisible:
          type: boolean
        isVisible:

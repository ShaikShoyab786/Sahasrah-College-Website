components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sahasara_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
        displayName:
          type: string
      required:
        - authenticated
        - email
        - displayName
    SiteSettings:
      type: object
      properties:
        id:
          type: string
        collegeName:
          type: string
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        primaryColor:
          type: string
        accentColor:
          type: string
        footerText:
          type: string
      required:
        - id
        - collegeName
        - tagline
        - logoUrl
        - email
        - phone
        - address
        - primaryColor
        - accentColor
        - footerText
    SiteSettingsInput:
      type: object
      properties:
        collegeName:
          type: string
          minLength: 1
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?$"
        footerText:
          type: string
      required:
        - collegeName
        - tagline
        - logoUrl
        - email
        - phone
        - address
        - primaryColor
        - accentColor
        - footerText
    HomepageHeroSlide:
      type: object
      properties:
        id:
          type: string
        displayOrder:
          type: integer
          minimum: 1
          maximum: 3
        eyebrowText:
          type: string
        heading:
          type: string
        highlightedHeadingText:
          type: string
        description:
          type: string
        primaryButtonLabel:
          type: string
        primaryButtonUrl:
          type: string
        secondaryButtonLabel:
          type: string
        secondaryButtonUrl:
          type: string
        heroImageUrl:
          type: ["string", "null"]
        heroImageAltText:
          type: string
      required:
        - id
        - displayOrder
        - eyebrowText
        - heading
        - highlightedHeadingText
        - description
        - primaryButtonLabel
        - primaryButtonUrl
        - secondaryButtonLabel
        - secondaryButtonUrl
        - heroImageUrl
        - heroImageAltText
    HomepageHeroSlides:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "#/components/schemas/HomepageHeroSlide"
    HomepageHeroSlideInput:
      type: object
      properties:
        displayOrder:
          type: integer
          minimum: 1
          maximum: 3
        eyebrowText:
          type: string
        heading:
          type: string
          minLength: 1
        highlightedHeadingText:
          type: string
        description:
          type: string
        primaryButtonLabel:
          type: string
        primaryButtonUrl:
          type: string
        secondaryButtonLabel:
          type: string
        secondaryButtonUrl:
          type: string
        heroImageUrl:
          type: ["string", "null"]
        heroImageAltText:
          type: string
          minLength: 1
      required:
        - displayOrder
        - eyebrowText
        - heading
        - highlightedHeadingText
        - description
        - primaryButtonLabel
        - primaryButtonUrl
        - secondaryButtonLabel
        - secondaryButtonUrl
        - heroImageUrl
        - heroImageAltText
    HomepageHeroSlidesInput:
      type: array
      minItems: 3
      maxItems: 3
      items:
        $ref: "#/components/schemas/HomepageHeroSlideInput"
    HomepageAboutPreview:
      type: object
      properties:
        id:
          type: string
        eyebrow:
          type: string
        heading:
          type: string
        description:
          type: string
        body:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        primaryImage:
          type: ["string", "null"]
        primaryImageAltText:
          type: string
        secondaryImage:
          type: ["string", "null"]
        secondaryImageAltText:
          type: string
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - eyebrow
        - heading
        - description
        - body
        - buttonLabel
        - buttonHref
        - primaryImage
        - primaryImageAltText
        - secondaryImage
        - secondaryImageAltText
        - isVisible
        - sortOrder
        - updatedAt
    HomepageAboutPreviewInput:
      type: object
      properties:
        eyebrow:
          type: string
        heading:
          type: string
          minLength: 1
        description:
          type: string
        body:
          type: string
        buttonLabel:
          type: string
        buttonHref:
          type: string
        primaryImage:
          type: ["string", "null"]
        primaryImageAltText:
          type: string
        secondaryImage:
          type: ["string", "null"]
        secondaryImageAltText:
          type: string
        isVisible:
          type: boolean
        sortOrder:
          type: integer
      required:
        - eyebrow
        - heading
        - description
        - body
        - buttonLabel
        - buttonHref
        - primaryImage
        - primaryImageAltText
        - secondaryImage
        - secondaryImageAltText
        - isVisible
        - sortOrder
    HomepageLiveUpdate:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        excerpt:
          type: string
        category:
          type: string
        actionBadge:
          type: ["string", "null"]
        publishDate:
          type: string
          format: date-time
        imageUrl:
          type: ["string", "null"]
        imageAltText:
          type: string
        detailUrl:
          type: string
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        displayOrder:
          type: integer
      required: [id, title, excerpt, category, actionBadge, publishDate, imageUrl, imageAltText, detailUrl, isFeatured, isActive, displayOrder]
    HomepageLiveUpdateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        actionBadge:
          type: ["string", "null"]
        publishDate:
          type: string
          format: date-time
        imageUrl:
          type: ["string", "null"]
        imageAltText:
          type: string
          minLength: 1
        detailUrl:
          type: string
          minLength: 1
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        displayOrder:
          type: integer

      operationId: submitContactEnquiry
      tags: [public]
      summary: Store a Contact page enquiry for administrator review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
